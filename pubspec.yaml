name: movie_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.12.2'

dependencies:
  flutter:
    sdk: flutter
  carousel_slider_plus: ^7.0.0
  dio: ^5.11.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  provider: ^6.1.5+1
  flutter_native_splash: ^2.4.8
  firebase_auth: ^6.6.0
  google_sign_in: ^7.2.0
  palette_generator: ^0.3.3+7
  firebase_core: ^4.14.0
  fluttertoast: ^10.0.0
  flutter_bloc: ^9.1.1
  carousel_slider: ^5.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/images/1x/
    - assets/images/2x/
    - assets/images/3x/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/img.png"